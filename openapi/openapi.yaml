openapi: 3.1.0
info:
  title: Productor API
  version: 1.0.0
  description: API مستقل پروداکتر برای احراز هویت، کاتالوگ، نظارت و مشارکت.
servers:
  - url: http://localhost:8080
security: []
tags:
  - { name: Health }
  - { name: Auth }
  - { name: Catalog }
  - { name: Organizations }
  - { name: Products }
  - { name: Participation }
  - { name: Moderation }
  - { name: Admin }
paths:
  /healthz:
    get:
      tags: [Health]
      summary: سلامت HTTP
      responses: { "200": { description: سرویس فعال است } }
  /readyz:
    get:
      tags: [Health]
      summary: آمادگی سرویس و پایگاه‌داده
      responses: { "200": { description: آماده }, "503": { $ref: "#/components/responses/Error" } }
  /api/v1:
    get:
      tags: [Health]
      summary: نسخهٔ API
      responses: { "200": { description: شناسه و نسخهٔ سرویس } }
  /api/v1/auth/otp/request:
    post:
      tags: [Auth]
      summary: درخواست OTP توسعه‌ای
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties: { phone: { type: string } }
      responses: { "202": { description: کد فقط در log سرور توسعه نمایش داده می‌شود }, "400": { $ref: "#/components/responses/Error" }, "429": { $ref: "#/components/responses/Error" } }
  /api/v1/auth/otp/verify:
    post:
      tags: [Auth]
      summary: تأیید OTP و ساخت نشست HttpOnly
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties: { phone: { type: string }, code: { type: string, pattern: "^[0-9]{6}$" } }
      responses: { "200": { description: نشست ایجاد شد }, "401": { $ref: "#/components/responses/Error" }, "403": { $ref: "#/components/responses/Error" } }
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      security: [{ SessionCookie: [] }]
      responses: { "204": { description: نشست لغو شد }, "401": { $ref: "#/components/responses/Error" } }
  /api/v1/me:
    get:
      tags: [Auth]
      security: [{ SessionCookie: [] }]
      responses: { "200": { description: حساب جاری }, "401": { $ref: "#/components/responses/Error" } }
  /api/v1/products:
    get:
      tags: [Catalog]
      summary: محصولات منتشرشده با فیلتر و صفحه‌بندی
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
        - { name: platform, in: query, schema: { type: string } }
        - { name: pricing, in: query, schema: { type: string } }
        - { name: openSource, in: query, schema: { type: boolean } }
        - { name: org, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [recent, votes, name] } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses: { "200": { description: صفحهٔ محصول‌ها }, "400": { $ref: "#/components/responses/Error" } }
  /api/v1/products/{slug}:
    get:
      tags: [Catalog]
      summary: جزئیات محصول منتشرشده
      parameters: [{ $ref: "#/components/parameters/Slug" }]
      responses: { "200": { description: محصول }, "404": { $ref: "#/components/responses/Error" } }
    patch:
      tags: [Products]
      summary: ذخیرهٔ پیش‌نویس؛ تغییر محصول منتشرشده نسخهٔ تازه می‌سازد
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/Slug" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductPayload" }
      responses: { "200": { description: پیش‌نویس ذخیره شد }, "400": { $ref: "#/components/responses/Error" }, "409": { $ref: "#/components/responses/Error" } }
  /api/v1/products/{slug}/manage:
    get:
      tags: [Products]
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/Slug" }]
      responses: { "200": { description: نسخهٔ جاری برای عضو ارگان }, "404": { $ref: "#/components/responses/Error" } }
  /api/v1/products/{slug}/submit:
    post:
      tags: [Products]
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/Slug" }]
      responses: { "200": { description: نسخه برای بررسی ارسال شد }, "400": { $ref: "#/components/responses/Error" }, "409": { $ref: "#/components/responses/Error" } }
  /api/v1/products/{slug}/vote:
    get:
      tags: [Participation]
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/Slug" }]
      responses: { "200": { description: وضعیت رأی کاربر } }
    put:
      tags: [Participation]
      summary: ثبت رأی مثبت یکتا
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/Slug" }]
      responses: { "200": { description: شمارنده و وضعیت رأی } }
    delete:
      tags: [Participation]
      summary: پس‌گرفتن رأی
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/Slug" }]
      responses: { "200": { description: شمارندهٔ به‌روز } }
  /api/v1/products/{slug}/comments:
    get:
      tags: [Participation]
      parameters: [{ $ref: "#/components/parameters/Slug" }, { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Offset" }]
      responses: { "200": { description: نظرهای منتشرشده } }
    post:
      tags: [Participation]
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/Slug" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties: { body: { type: string, minLength: 10, maxLength: 2000 } }
      responses: { "201": { description: نظر وارد صف بررسی شد }, "400": { $ref: "#/components/responses/Error" } }
  /api/v1/organizations:
    get:
      tags: [Organizations]
      parameters: [{ name: q, in: query, schema: { type: string } }, { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Offset" }]
      responses: { "200": { description: فهرست ارگان‌ها } }
    post:
      tags: [Organizations]
      security: [{ SessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationInput" }
      responses: { "201": { description: ارگان بلافاصله عمومی شد }, "400": { $ref: "#/components/responses/Error" } }
  /api/v1/organizations/{slug}:
    get:
      tags: [Organizations]
      parameters: [{ $ref: "#/components/parameters/Slug" }]
      responses: { "200": { description: جزئیات ارگان } }
    patch:
      tags: [Organizations]
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/Slug" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationInput" }
      responses: { "200": { description: ارگان ویرایش شد }, "403": { $ref: "#/components/responses/Error" } }
  /api/v1/organizations/{slug}/products:
    get:
      tags: [Catalog]
      parameters: [{ $ref: "#/components/parameters/Slug" }, { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Offset" }]
      responses: { "200": { description: محصولات منتشرشدهٔ ارگان } }
    post:
      tags: [Products]
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/Slug" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/ProductPayload" }
                - type: object
                  properties:
                    slug: { type: string }
                    mode: { type: string, enum: [draft, submit] }
      responses: { "201": { description: محصول/پیش‌نویس ایجاد شد }, "403": { $ref: "#/components/responses/Error" } }
  /api/v1/organizations/{slug}/products/manage:
    get:
      tags: [Products]
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/Slug" }, { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Offset" }]
      responses: { "200": { description: محصولات جاری ارگان برای عضو مجاز } }
  /api/v1/organizations/{slug}/media:
    post:
      tags: [Products]
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/Slug" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties: { file: { type: string, format: binary } }
      responses: { "201": { description: فایل تا انتشار خصوصی است }, "400": { $ref: "#/components/responses/Error" } }
  /api/v1/topics:
    get:
      tags: [Catalog]
      responses: { "200": { description: فهرست تاپیک‌های فعال } }
  /api/v1/categories:
    get:
      tags: [Catalog]
      responses: { "200": { description: حوزه‌ها و برچسب‌های دسته‌بندی } }
  /api/v1/leaderboard:
    get:
      tags: [Catalog]
      parameters:
        - { name: period, in: query, required: true, schema: { type: string, enum: [today, month] } }
        - { $ref: "#/components/parameters/Limit" }
      responses: { "200": { description: رتبه‌بندی رأی‌ها بر اساس ساعت تهران } }
  /api/v1/me/organizations:
    get:
      tags: [Organizations]
      security: [{ SessionCookie: [] }]
      responses: { "200": { description: ارگان‌های حساب جاری } }
  /api/v1/me/products:
    get:
      tags: [Products]
      security: [{ SessionCookie: [] }]
      parameters: [{ name: org, in: query, schema: { type: string } }, { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Offset" }]
      responses: { "200": { description: محصول‌های قابل مدیریت حساب } }
  /api/v1/me/comments:
    get:
      tags: [Participation]
      security: [{ SessionCookie: [] }]
      responses: { "200": { description: نظرهای خود کاربر و مهلت اصلاح } }
  /api/v1/me/votes:
    get:
      tags: [Participation]
      security: [{ SessionCookie: [] }]
      responses: { "200": { description: رأی‌های فعال حساب } }
  /api/v1/me/notifications:
    get:
      tags: [Participation]
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Offset" }]
      responses: { "200": { description: اعلان‌ها و شمارندهٔ خوانده‌نشده } }
  /api/v1/me/notifications/read-all:
    post:
      tags: [Participation]
      security: [{ SessionCookie: [] }]
      responses: { "204": { description: همه اعلان‌ها خوانده شدند } }
  /api/v1/notifications/{id}/read:
    post:
      tags: [Participation]
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "204": { description: اعلان خوانده شد }, "404": { $ref: "#/components/responses/Error" } }
  /api/v1/comments/{id}:
    patch:
      tags: [Participation]
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties: { body: { type: string, minLength: 10, maxLength: 2000 } }
      responses: { "200": { description: نظر اصلاح و دوباره ارسال شد }, "409": { $ref: "#/components/responses/Error" } }
    delete:
      tags: [Participation]
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "204": { description: نظر حذف شد } }
  /api/v1/media/{key}:
    get:
      tags: [Products]
      parameters: [{ name: key, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: تصویر عمومی یا خصوصی برای کاربر مجاز
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "404": { description: فایل پیدا نشد یا خصوصی است }
  /api/v1/moderation/products:
    get:
      tags: [Moderation]
      security: [{ SessionCookie: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, submitted, in_review, all] } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses: { "200": { description: صف بررسی محصول‌ها }, "403": { $ref: "#/components/responses/Error" } }
  /api/v1/moderation/products/{slug}/versions:
    get:
      tags: [Moderation]
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/Slug" }, { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Offset" }]
      responses: { "200": { description: نسخه‌های محصول همراه با payload و پرچم نسخهٔ جاری/منتشرشده } }
  /api/v1/moderation/products/{slug}/claim:
    post:
      tags: [Moderation]
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/Slug" }]
      responses: { "200": { description: محصول برای بررسی گرفته شد }, "409": { $ref: "#/components/responses/Error" } }
  /api/v1/moderation/products/{slug}/decision:
    post:
      tags: [Moderation]
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/Slug" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [approve, return, reject] }
                note: { type: string, maxLength: 400 }
      responses: { "200": { description: تصمیم، تاریخچه و اعلان ثبت شدند }, "400": { $ref: "#/components/responses/Error" }, "409": { $ref: "#/components/responses/Error" } }
  /api/v1/moderation/products/{slug}:
    patch:
      tags: [Moderation]
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/Slug" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductPayload" }
      responses: { "200": { description: ویرایش ناظر ثبت شد }, "403": { $ref: "#/components/responses/Error" } }
  /api/v1/moderation/products/{slug}/unpublish:
    post:
      tags: [Moderation]
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/Slug" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { note: { type: string, maxLength: 400 } }
      responses: { "200": { description: محصول از انتشار خارج شد }, "404": { $ref: "#/components/responses/Error" } }
  /api/v1/moderation/comments:
    get:
      tags: [Moderation]
      security: [{ SessionCookie: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, rejected] } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses: { "200": { description: صف بررسی نظرها } }
  /api/v1/moderation/comments/{id}/decision:
    post:
      tags: [Moderation]
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [approve, reject] }
                note: { type: string, maxLength: 300 }
      responses: { "200": { description: نظر بررسی شد؛ رد، مهلت ۴۸ ساعته می‌دهد } }
  /api/v1/admin/overview:
    get:
      tags: [Admin]
      security: [{ SessionCookie: [] }]
      summary: آمار پنل مدیریت؛ نیازمند dashboard.view
      responses: { "200": { description: آمار کلی سامانه }, "403": { $ref: "#/components/responses/Error" } }
  /api/v1/admin/products:
    get:
      tags: [Admin]
      security: [{ SessionCookie: [] }]
      summary: فهرست محصولات برای پنل؛ نیازمند products.view
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, submitted, in_review, draft, changes_requested, rejected, published, unpublished, all], default: all } }
        - { name: q, in: query, schema: { type: string, maxLength: 120 } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses: { "200": { description: فهرست صفحه‌بندی‌شدهٔ محصولات }, "403": { $ref: "#/components/responses/Error" } }
  /api/v1/admin/comments:
    get:
      tags: [Admin]
      security: [{ SessionCookie: [] }]
      summary: فهرست نظرها برای پنل؛ نیازمند comments.view
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, rejected, published, all], default: all } }
        - { name: q, in: query, schema: { type: string, maxLength: 120 } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses: { "200": { description: فهرست صفحه‌بندی‌شدهٔ نظرها }, "403": { $ref: "#/components/responses/Error" } }
  /api/v1/admin/organizations:
    get:
      tags: [Admin]
      security: [{ SessionCookie: [] }]
      summary: فهرست ارگان‌ها؛ نیازمند organizations.view
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 120 } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses: { "200": { description: ارگان‌ها همراه با شمار اعضا و محصولات }, "403": { $ref: "#/components/responses/Error" } }
  /api/v1/admin/organizations/{slug}:
    patch:
      tags: [Admin]
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/Slug" }]
      summary: ویرایش مشخصات ارگان؛ نیازمند organizations.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, website]
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                logo: { type: string }
                bio: { type: string, maxLength: 4000 }
                website: { type: string, format: uri }
                links: { type: array, maxItems: 20, items: { type: object } }
      responses: { "200": { description: مشخصات ارگان به‌روز شد }, "400": { $ref: "#/components/responses/Error" }, "404": { $ref: "#/components/responses/Error" } }
  /api/v1/admin/categories:
    get:
      tags: [Admin]
      security: [{ SessionCookie: [] }]
      summary: فهرست دسته‌بندی‌ها؛ نیازمند taxonomy.view
      responses: { "200": { description: دسته‌بندی‌ها با برچسب‌ها و جایگاه } }
    post:
      tags: [Admin]
      security: [{ SessionCookie: [] }]
      summary: ساخت دسته‌بندی؛ نیازمند taxonomy.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, name, tags]
              properties:
                id: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$" }
                name: { type: string, minLength: 2, maxLength: 120 }
                tags: { type: array, maxItems: 150, items: { type: string, maxLength: 100 } }
                position: { type: integer, minimum: 0, maximum: 32767 }
      responses: { "201": { description: دسته‌بندی ساخته شد }, "409": { $ref: "#/components/responses/Error" } }
  /api/v1/admin/categories/{id}:
    patch:
      tags: [Admin]
      security: [{ SessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      summary: ویرایش دسته‌بندی؛ نیازمند taxonomy.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                tags: { type: array, maxItems: 150, items: { type: string, maxLength: 100 } }
                position: { type: integer, minimum: 0, maximum: 32767 }
      responses: { "200": { description: دسته‌بندی به‌روز شد }, "409": { $ref: "#/components/responses/Error" } }
  /api/v1/admin/topics:
    get:
      tags: [Admin]
      security: [{ SessionCookie: [] }]
      summary: فهرست همهٔ موضوع‌ها؛ نیازمند taxonomy.view
      responses: { "200": { description: موضوع‌ها همراه با وضعیت فعال و جایگاه } }
    post:
      tags: [Admin]
      security: [{ SessionCookie: [] }]
      summary: ساخت موضوع؛ نیازمند taxonomy.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, label, tone, icon]
              properties:
                slug: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$" }
                label: { type: string, minLength: 2, maxLength: 120 }
                tone: { type: integer, minimum: 1, maximum: 7 }
                icon: { type: string, maxLength: 80 }
                position: { type: integer, minimum: 0, maximum: 32767 }
      responses: { "201": { description: موضوع ساخته شد }, "409": { $ref: "#/components/responses/Error" } }
  /api/v1/admin/topics/{slug}:
    patch:
      tags: [Admin]
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/Slug" }]
      summary: ویرایش تنظیمات موضوع؛ نیازمند taxonomy.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tone: { type: integer, minimum: 1, maximum: 7 }
                icon: { type: string, maxLength: 80 }
                position: { type: integer, minimum: 0, maximum: 32767 }
                isActive: { type: boolean }
      responses: { "200": { description: موضوع به‌روز شد }, "404": { $ref: "#/components/responses/Error" } }
    delete:
      tags: [Admin]
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/Slug" }]
      summary: غیرفعال‌سازی نرم موضوع؛ نیازمند taxonomy.manage
      responses: { "200": { description: موضوع غیرفعال شد }, "404": { $ref: "#/components/responses/Error" } }
  /api/v1/admin/roles:
    get:
      tags: [Admin]
      security: [{ SessionCookie: [] }]
      summary: فهرست نقش‌ها و کاتالوگ مجوزها؛ مدیر کل
      responses: { "200": { description: نقش‌ها و مجوزهای قابل تخصیص }, "403": { $ref: "#/components/responses/Error" } }
    post:
      tags: [Admin]
      security: [{ SessionCookie: [] }]
      summary: ساخت نقش سفارشی؛ مدیر کل
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, permissions]
              properties:
                name: { type: string, minLength: 2, maxLength: 80 }
                description: { type: string, maxLength: 240 }
                permissions: { type: array, items: { type: string } }
      responses: { "201": { description: نقش ساخته شد }, "400": { $ref: "#/components/responses/Error" } }
  /api/v1/admin/roles/{id}:
    patch:
      tags: [Admin]
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      summary: ویرایش نقش سفارشی؛ مدیر کل
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 2, maxLength: 80 }
                description: { type: string, maxLength: 240 }
                permissions: { type: array, items: { type: string } }
      responses: { "200": { description: نقش به‌روز شد }, "403": { $ref: "#/components/responses/Error" }, "409": { $ref: "#/components/responses/Error" } }
    delete:
      tags: [Admin]
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      summary: حذف نقش خالی و سفارشی؛ مدیر کل
      responses: { "204": { description: نقش حذف شد }, "403": { $ref: "#/components/responses/Error" }, "409": { $ref: "#/components/responses/Error" } }
  /api/v1/admin/users:
    get:
      tags: [Admin]
      security: [{ SessionCookie: [] }]
      parameters: [{ name: q, in: query, schema: { type: string } }, { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Offset" }]
      responses: { "200": { description: حساب‌ها برای مدیر }, "403": { $ref: "#/components/responses/Error" } }
  /api/v1/admin/users/{id}:
    patch:
      tags: [Admin]
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { type: string, enum: [user, moderator, admin] }
                adminRoleId: { type: string, description: شناسهٔ نقش کارمندی؛ رشتهٔ خالی نقش را پاک می‌کند }
                blocked: { type: boolean }
      responses: { "200": { description: نقش/مسدودی به‌روز شد }, "403": { $ref: "#/components/responses/Error" }, "409": { $ref: "#/components/responses/Error" } }
  /api/v1/admin/audit:
    get:
      tags: [Admin]
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Offset" }]
      responses: { "200": { description: رخدادهای ممیزی مدیریت }, "403": { $ref: "#/components/responses/Error" } }
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: productor_session
  parameters:
    Slug:
      name: slug
      in: path
      required: true
      schema: { type: string }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
  responses:
    Error:
      description: خطا؛ پاسخ با قالب error.code و error.message
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: { type: string }
                  message: { type: string }
  schemas:
    OrganizationInput:
      type: object
      required: [name, website]
      properties:
        slug: { type: string }
        name: { type: string, minLength: 2, maxLength: 120 }
        logo: { type: string }
        bio: { type: string, maxLength: 4000 }
        website: { type: string, format: uri }
        links: { type: array, items: { type: object, required: [label, href], properties: { label: { type: string }, href: { type: string, format: uri } } } }
    ProductPayload:
      type: object
      required: [name, tagline, description, mainCategory, categories, platforms, pricing, website, features]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        logo: { type: string }
        tagline: { type: string, minLength: 15, maxLength: 240 }
        description: { type: string, minLength: 40, maxLength: 30000 }
        mainCategory: { type: string }
        categories: { type: array, minItems: 1, maxItems: 10, items: { type: string } }
        platforms: { type: array, minItems: 1, maxItems: 10, items: { type: string, enum: [web, android, ios, windows, macos, linux, cloud, self_hosted] } }
        pricing: { type: string, enum: [free, freemium, paid, open_source] }
        openSource: { type: boolean }
        repoUrl: { type: string, format: uri }
        website: { type: string, format: uri }
        features: { type: array, minItems: 1, maxItems: 50, items: { type: object, required: [key, label, value], properties: { key: { type: string }, label: { type: string }, value: { type: string } } } }
        pros: { type: array, items: { type: string } }
        cons: { type: array, items: { type: string } }
        media: { type: array, items: { type: object } }
        userTags: { type: array, items: { type: string } }
        similar: { type: array, items: { type: string } }
        audience: { type: string, maxLength: 500 }
